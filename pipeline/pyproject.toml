[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vdebt"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vdebt*", "vdebt_verify*"]

[tool.ruff]
line-length = 100
target-version = "py312"
